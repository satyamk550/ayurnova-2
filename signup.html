<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | AyurNova 🌿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen bg-cover bg-center" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><rect width="100" height="100" fill="%23a5d6a7"/><circle cx="50" cy="50" r="45" fill="none" stroke="%232e7d32" stroke-width="2" opacity="0.5"/><path d="M50 5 L5 95 L95 95 Z" fill="%232e7d32" opacity="0.05"/></svg>');">

    <div class="w-full max-w-lg mx-4 p-8 glass shadow-2xl">
        <div class="text-center mb-8">
            <a href="landingpage.html" class="inline-flex items-center space-x-2 text-3xl font-extrabold text-[#2e7d32]">
                <span aria-hidden="true">🌿</span>
                <span>AyurNova Signup</span>
            </a>
            <p class="text-gray-600 mt-2">Join the unified Ayurvedic digital ecosystem</p>
        </div>

        <form id="signup-form">
            <div class="mb-4">
                <label for="full-name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                <input type="text" id="full-name" name="fullName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#2e7d32] focus:border-transparent transition duration-150" placeholder="John Doe" aria-label="Full Name">
            </div>

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#2e7d32] focus:border-transparent transition duration-150" placeholder="your.email@example.com" aria-label="Email address">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#2e7d32] focus:border-transparent transition duration-150" placeholder="Minimum 8 characters" aria-label="Password">
            </div>

            <div class="mb-6">
                <label for="role" class="block text-sm font-medium text-gray-700 mb-2">I am a...</label>
                <select id="role" name="role" required class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-[#2e7d32] focus:border-transparent appearance-none transition duration-150" aria-label="User Role">
                    <option value="" disabled selected>Select Your Role</option>
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor / Clinic Staff</option>
                    <option value="government">Government Official / Auditor</option>
                </select>
            </div>

            <button type="submit" class="w-full btn-primary text-white font-semibold py-3 rounded-full shadow-lg transition duration-150 ease-in-out" aria-label="Create AyurNova Account">
                Create Account
            </button>

            <p id="signup-message" class="mt-4 text-center text-red-500 font-medium hidden" role="alert">
                </p>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? <a href="login.html" class="text-[#2e7d32] font-medium hover:text-[#1b5e20] transition duration-150">Login here</a>
            </p>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
</body>
</html>
